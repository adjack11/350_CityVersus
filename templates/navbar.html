<header class="site-header">

    <nav class="navbar">

        <h1 id="project-title">City Versus</h1>

	<!--NAVIGATION DROPDOWN-->
	<div class="nav-dropdown">
        <label for="nav">Features:</label>
		<select id="nav" onchange="page_redirect(this.value)">
            <option value="" disabled selected></option>
            <!-- CHANGED TO ROUTE FOR FLASK instead of html filenames -->
            <option value="/city">City Statistics</option>
            <option value="/compare">Compare Cities</option>
			<option value="/charts">Charts</option>
		</select>
	</div>




        <!-- SEARCH BAR -->
        <search>
            <form action="/search" method="get">
                <label for="city-search">Search for a city:</label>

                <input
                        type="search"
                        name="city"
                        id="city-search"
                        placeholder="Enter a city name"
                >

                <button class="nav-button" type="button" onclick="search()">Search</button>
            </form>
        </search>

        <!-- FACT SELECTOR -->
        <div class="fact-selector">
            <label for="fact">Select a fact:</label>

            <select id="fact">
                <option value="population">Population</option>
                <option value="income">Median income</option>
                <option value="poverty-rate">Poverty rate</option>
            </select>
        </div>

        <div class="user-welcome">
            {% if session.get('username') %}
                <span>Welcome, {{ session.get('username') }}</span>
                <a href="/logout" style="margin-left: 15px;">Log Out</a>
            {% else %}
                <a href="/login">Log In</a>
            {% endif %}
        </div>

    </nav>

</header>
